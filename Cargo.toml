[package]
name = "ccview-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
portable-pty = "0.9.0"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[lints.clippy]
too_many_arguments = "warn"
large_enum_variant = "warn"
